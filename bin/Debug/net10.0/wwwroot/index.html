<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance Utility</title>
    <script src="js/chart.min.js"></script>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; transition: 0.3s; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 850px; margin: 0 auto; }
        .panel { background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #a0a0a0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .btn { background: #007acc; color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.2s; margin-bottom: 10px; }
        .btn:hover { background: #005999; }
        .btn-alert { background: #cc3300; }
        .btn-alert:hover { background: #992600; }
        .btn-small { background: #444; padding: 8px; border: none; color: white; border-radius: 4px; cursor: pointer; }
        
        .flex-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input { flex: 1; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; color-scheme: dark; }
        
        .log-container { max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2a2a2a; position: sticky; top: 0; }
        .delete-btn { color: #ff5252; cursor: pointer; text-align: center; font-weight: bold; }
        
        #blackoutBanner { display: none; background: #ff9800; color: #000; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; text-align: center; }
        
        /* Stealth Mode */
        body.stealth .sensitive-data { filter: blur(5px); opacity: 0.5; }
        body.stealth .stealth-title::before { content: "Network Packet Diagnostics"; visibility: visible; display: block; }
        body.stealth .stealth-title span { display: none; }
    </style>
</head>
<body>
    <div id="blackoutBanner">CLINICAL BLACKOUT ACTIVE: No maintenance permitted.</div>
    
    <div class="grid">
        <!-- Control Panel -->
        <div class="panel">
            <h2 class="stealth-title"><span>Operational Controls</span></h2>
            <button class="btn sensitive-data" onclick="sendAction('LOG_EVENT')">Execute Maintenance Protocol</button>
            
            <h2 style="margin-top:20px;">Manual / Retroactive Entry</h2>
            <div class="flex-row">
                <input type="datetime-local" id="manualDate">
                <button class="btn-small" onclick="addManualLog()">Inject</button>
            </div>

            <h2 style="margin-top:20px;">Clinical Target (OHSU)</h2>
            <div class="flex-row">
                <input type="datetime-local" id="ohsuDate">
                <button class="btn-small" onclick="setAppointment()">Set Target</button>
                <button class="btn-small btn-alert" onclick="clearAppointment()">Clear</button>
            </div>
            
            <button class="btn-small" style="width:100%; margin-top:15px;" onclick="sendAction('EXPORT_CSV')">Export Data to CSV</button>
        </div>

        <!-- Analytics & Logs -->
        <div class="panel">
            <h2>Frequency Analytics</h2>
            <div class="sensitive-data" style="height: 150px; margin-bottom: 20px;">
                <canvas id="chartCanvas"></canvas>
            </div>

            <h2>Protocol History</h2>
            <div class="log-container sensitive-data">
                <table>
                    <thead><tr><th>Timestamp</th><th style="width:40px;">Rev</th></tr></thead>
                    <tbody id="logTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let frequencyChart = null;

        // Stealth Mode Toggle (Esc Key)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.body.classList.toggle('stealth');
        });

        function sendAction(action, payload = {}) {
            payload.action = action;
            window.external.sendMessage(JSON.stringify(payload));
        }

        function addManualLog() {
            let dateInput = document.getElementById('manualDate').value;
            if (!dateInput) return;
            
            // WebKitGTK Hack: Force seconds into the string so the Date parser doesn't panic
            if (dateInput.length === 16) dateInput += ":00";
            
            const unixTime = Math.floor(new Date(dateInput).getTime() / 1000);
            sendAction('MANUAL_LOG', { timestamp: unixTime });
            
            // Clear the input field after successful injection
            document.getElementById('manualDate').value = '';
        }

        function setAppointment() {
            let dateInput = document.getElementById('ohsuDate').value;
            if (!dateInput) return;
            
            if (dateInput.length === 16) dateInput += ":00";
            
            const unixTime = Math.floor(new Date(dateInput).getTime() / 1000);
            sendAction('SET_APPOINTMENT', { timestamp: unixTime });
            document.getElementById('ohsuDate').value = '';
        }
        
        function clearAppointment() {
            if (confirm("Cancel the active clinical blackout?")) {
                sendAction('CLEAR_APPOINTMENT');
                document.getElementById('ohsuDate').value = '';
            }
        }

        function deleteLog(id) {
            if (confirm("Delete this record?")) sendAction('DELETE_LOG', { id: id });
        }

        window.external.receiveMessage(function(message) {
            const response = JSON.parse(message);
            
            if (response.action === 'NOTIFY') {
                alert(response.message);
                return;
            }

            if (response.action === 'UPDATE_STATE') {
                // Update Table
                const tbody = document.getElementById('logTableBody');
                tbody.innerHTML = '';
                response.logs.forEach(log => {
                    tbody.innerHTML += `<tr>
                        <td>${new Date(log.timestamp * 1000).toLocaleString()}</td>
                        <td class="delete-btn" onclick="deleteLog(${log.id})">✕</td>
                    </tr>`;
                });

                // Update Blackout Banner
                const now = Math.floor(Date.now() / 1000);
                const appt = response.appointment;
                const banner = document.getElementById('blackoutBanner');
                
                if (appt > now && (appt - now) <= (5 * 24 * 3600)) {
                    banner.style.display = 'block';
                    banner.innerText = `CLINICAL BLACKOUT ACTIVE: ${((appt - now) / 3600).toFixed(1)} hours remaining to target.`;
                } else {
                    banner.style.display = 'none';
                }

                // Update Chart.js
                updateChart(response.logs);
            }
        });

        function updateChart(logs) {
            if (logs.length < 2) return;
            
            // Calculate gaps in hours between consecutive events
            const gaps = [];
            const labels = [];
            for (let i = 0; i < logs.length - 1; i++) {
                const diffHours = (logs[i].timestamp - logs[i+1].timestamp) / 3600;
                gaps.unshift(diffHours.toFixed(1)); // Reverse to show oldest to newest left-to-right
                labels.unshift(`Event ${logs.length - 1 - i}`);
            }

            const ctx = document.getElementById('chartCanvas').getContext('2d');
            if (frequencyChart) frequencyChart.destroy();
            
            frequencyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Turnover Delta (Hours)',
                        data: gaps,
                        borderColor: '#007acc',
                        backgroundColor: 'rgba(0, 122, 204, 0.2)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#333' } },
                        x: { display: false } 
                    }
                }
            });
        }

        window.onload = () => sendAction('GET_STATE');
    </script>
</body>
</html>
